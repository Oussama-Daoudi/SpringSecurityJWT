spring:
  datasource:
    url: jdbc:mysql://${MYSQL_Host:localhost}:3306/demoJWTSecurity
    #url: ${db-url}
    username: root
    password:
    #username: ${db-username}
    #password: ${db-password}
    #driver-class-name: org.postgresql.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    #database: postgresql
    #database-platform: org.hibernate.dialect.

application:
  security:
    jwt:
      secret-key: 37cc86b9634742f0e5218b71ee3e7b50897e388eb2d28229fca054e3ac6619d0
      expiration: 86400000 #a day
      refresh-token:
        expiration: 604800000 #7 days

server:
  port: 8081

# ===================== Swagger/OpenAPI Configuration =====================
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    disable-swagger-default-url: true
    # use-root-path: true # Uncomment if you want swagger-ui at root path
    doc-expansion: none
    default-model-expand-depth: 2
    default-model-rendering: example
    show-extensions: true
    show-common-extensions: true
    # Uncomment to customize swagger UI theme
    # config-url: /api-docs/swagger-config
    # layout: BaseLayout
  cache:
    disabled: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: true
  packages-to-scan: com.example.security
  paths-to-match: /**
  # Group APIs by tag in swagger-ui
  group-configs:
    - group: 'all'
      paths-to-match: /**
      packages-to-scan: com.example.security

# ===================== Optional: Logging for Swagger =====================
logging:
  level:
    org.springframework.web: INFO
    org.springdoc: INFO
    com.example.security: DEBUG